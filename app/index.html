<head>

    <!-- Social preview (WhatsApp / Telegram / X / Facebook) -->

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Peace Paths">
    <meta property="og:title" content="Peace Paths — נתיבי השלום">

    <!-- The default UI is Hebrew: fetch its font subset immediately. -->
    <link rel="preload" href="./fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="#solutionsGrid" class="skip-link">דלגו לפתרונות</a>
    <div class="app" role="main" aria-label="Peace Paths">

        <!-- ── Header ──────────────────────────────── -->
        <header class="header" aria-label="Header">
            <div>
                <h1 class="logo"><a href="#">🕊 <span id="logoText">Peace Paths</span></a></h1>
                <div class="tagline">לאן מכוונות מאמצי השלום</div>
            </div>
            <div class="header-right">
                <span class="last-updated" id="lastUpdated"></span>
                <span class="refresh-badge" id="refreshBadge" title="התעדכן אוטומטי כל 15 דקות">↻</span>
            </div>
        </header>

        <!-- ── Controls Bar (lang + info + theme) ──── -->
        <div class="controls-bar">
            <div class="lang-switcher" id="langSwitcher"></div>
            <div class="controls-right">
                <button class="theme-toggle" id="themeToggle" title="מצב כהה/בהיר">🌙</button>
                <div class="info-link"><a href="#" id="infoBtn">ℹ איך זה עובד</a></div>
            </div>
        </div>

        <!-- ── Classification Warning ──────────────── -->
        <div id="classificationWarning" class="classification-warning"></div>

        <!-- ── Welcome / Momentum Banner ───────────── -->
        <div class="momentum-banner" id="momentumBanner">
            <div class="momentum-text">
                <p class="welcome-text" id="welcomeText"></p>
                <p class="momentum-summary" id="momentumSummary"></p>
            </div>
        </div>

        <!-- ── Live Activity Feed ──────────────────── -->
        <div class="activity-section">
            <div class="section-header collapsible-toggle open" role="button" tabindex="0" aria-expanded="true" aria-controls="activityFeed"><span class="live-dot"></span>פעילות אחרונה</div>
            <div class="activity-feed collapsible-body open" id="activityFeed"></div>
            <button class="activity-more" id="showMoreActivity" type="button"></button>
        </div>

        <!-- ── Solutions Grid (dynamic) ────────────── -->
        <div class="category-group">
            <div class="section-header">פתרונות</div>
            <div id="solutionsGrid" aria-live="polite" aria-busy="true">
              <div class="skeleton-card" aria-hidden="true"><div class="skeleton-line w40"></div><div class="skeleton-line w90"></div><div class="skeleton-line w80"></div><div class="skeleton-line w60"></div></div>
              <div class="skeleton-card" aria-hidden="true"><div class="skeleton-line w40"></div><div class="skeleton-line w90"></div><div class="skeleton-line w70"></div><div class="skeleton-line w50"></div></div>
            </div>
        </div>

        <!-- ── Quiet tracks (no new developments; archive) ── -->
        <div class="category-group quiet-section" id="quietTracks" hidden>
            <button class="section-header collapsible-toggle quiet-header" id="quietTracksHeader" type="button">מהלכים ללא התפתחויות חדשות</button>
            <div class="collapsible-body quiet-list" id="quietTracksList"></div>
        </div>

        <!-- ── Footer ──────────────────────────────── -->
        <footer class="footer">
            <p>Peace Paths הוא פרויקט ניסיוני למטרות מידע בלבד.</p>
            <p>נתונים מ-<span id="feedCount">72</span> מקורות RSS · סיווג בעזרת AI</p>
            <p>ההערכות הן אלגוריתמיות, לא תחזיות.</p>
            <nav class="footer-links" aria-label="Footer links">
              <span id="versionTag" class="footer-link"></span>
              <a href="#" id="privacyLink" class="footer-link">מדיניות פרטיות</a>
              <a href="#" id="termsLink" class="footer-link">תנאי שימוש</a>
              <a href="#" id="accessibilityLink" class="footer-link">נגישות</a>
              <a href="https://github.com/ErezIsrael/peace-paths/issues" target="_blank" rel="noopener" class="footer-link">🐛 דווח על באג</a>
              <a href="https://ko-fi.com/erezse" target="_blank" rel="noopener" class="footer-link">☕ קנה לי קפה</a>
              <a href="mailto:erez@peace-paths.com" class="footer-link">📧 צור קשר</a>
            </nav>
        </footer>
    </div>

    <!-- ── Modal ───────────────────────────────────── -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalContent">
            <div id="modalContent"></div>
            <button class="modal-close" id="modalClose">סגור</button>
        </div>
    </div>

    <script src="app.js?v=0.7.0"></script>
</body>
</html>
