<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Peace Paths — AI-Powered Middle East Peace Tracker</title>
  <desc id="desc">A dashboard tracking concrete peace initiatives across the Middle East using AI classification of 75 RSS feeds, showing solution cards with phase progression and momentum indicators.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#81d4fa"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132a4a"/>
      <stop offset="100%" stop-color="#0f2240"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3358"/>
      <stop offset="100%" stop-color="#142a4a"/>
    </linearGradient>
    <linearGradient id="barAdvancing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#66bb6a"/>
    </linearGradient>
    <linearGradient id="barStable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffc107"/>
      <stop offset="100%" stop-color="#ffca28"/>
    </linearGradient>
    <linearGradient id="barStalling" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#e57373"/>
    </linearGradient>
    <linearGradient id="pipeline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#81d4fa"/>
      <stop offset="100%" stop-color="#b3e5fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#fff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LEFT: Title Block -->
  <!-- ═══════════════════════════════════════════════ -->
  <g id="title-block" transform="translate(56, 48)">

    <!-- Category badge -->
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#4fc3f7" fill-opacity="0.12" stroke="#4fc3f7" stroke-width="1" stroke-opacity="0.3"/>
    <text x="70" y="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4fc3f7">AI PEACE TRACKER</text>

    <!-- Project name -->
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Peace Paths</text>

    <!-- Tagline -->
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#8ea8c8">Concrete peace initiatives across the Middle East</text>

    <!-- Trilingual indicator -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="52" height="26" rx="6" fill="#1a3358" stroke="#2a4a70" stroke-width="1"/>
      <text x="26" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#8ea8c8">EN</text>
      <rect x="60" y="0" width="52" height="26" rx="6" fill="#1a3358" stroke="#2a4a70" stroke-width="1"/>
      <text x="86" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#8ea8c8" direction="rtl">עברית</text>
      <rect x="120" y="0" width="52" height="26" rx="6" fill="#1a3358" stroke="#2a4a70" stroke-width="1"/>
      <text x="146" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#8ea8c8" direction="rtl">العربية</text>
    </g>

    <!-- Live link -->
    <g transform="translate(0, 185)">
      <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#4fc3f7">
        <tspan fill="#8ea8c8">→ </tspan>
        <tspan>peace-paths.pages.dev</tspan>
      </text>
    </g>

    <!-- Metadata row -->
    <g transform="translate(0, 230)">
      <circle cx="8" cy="8" r="4" fill="#4caf50" filter="url(#glow)"/>
      <text x="20" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8ea8c8">75 RSS feeds</text>
      <text x="160" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8ea8c8">·</text>
      <text x="180" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8ea8c8">llama.cpp</text>
      <text x="270" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8ea8c8">·</text>
      <text x="290" y="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8ea8c8">Cloudflare KV</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- RIGHT: Dashboard Preview + Pipeline -->
  <!-- ═══════════════════════════════════════════════ -->
  <g id="dashboard-preview" transform="translate(640, 40)">

    <!-- Pipeline flow at top -->
    <g transform="translate(0, 0)">
      <!-- RSS icon -->
      <rect x="0" y="0" width="100" height="44" rx="10" fill="#1a3358" stroke="#2a4a70" stroke-width="1"/>
      <text x="50" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4fc3f7">📡 75 Feeds</text>
      <text x="50" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5a7a9a">RSS Input</text>

      <!-- Arrow -->
      <path d="M105 22 L125 22" stroke="#4fc3f7" stroke-width="2" stroke-opacity="0.5" marker-end="url(#arrowhead)"/>
      <line x1="105" y1="22" x2="125" y2="22" stroke="#4fc3f7" stroke-width="2" stroke-opacity="0.4"/>
      <polygon points="125,18 133,22 125,26" fill="#4fc3f7" fill-opacity="0.6"/>

      <!-- AI icon -->
      <rect x="135" y="0" width="100" height="44" rx="10" fill="#1a3358" stroke="#2a4a70" stroke-width="1"/>
      <text x="185" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#81d4fa">🤖 AI</text>
      <text x="185" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5a7a9a">Classify</text>

      <!-- Arrow -->
      <line x1="240" y1="22" x2="260" y2="22" stroke="#4fc3f7" stroke-width="2" stroke-opacity="0.4"/>
      <polygon points="260,18 268,22 260,26" fill="#4fc3f7" fill-opacity="0.6"/>

      <!-- Dashboard icon -->
      <rect x="270" y="0" width="100" height="44" rx="10" fill="#1a3358" stroke="#2a4a70" stroke-width="1"/>
      <text x="320" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#b3e5fc">📊 Cards</text>
      <text x="320" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5a7a9a">Dashboard</text>

      <!-- Arrow -->
      <line x1="375" y1="22" x2="395" y2="22" stroke="#4fc3f7" stroke-width="2" stroke-opacity="0.4"/>
      <polygon points="395,18 403,22 395,26" fill="#4fc3f7" fill-opacity="0.6"/>

      <!-- KV icon -->
      <rect x="405" y="0" width="100" height="44" rx="10" fill="#1a3358" stroke="#2a4a70" stroke-width="1"/>
      <text x="455" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#b3e5fc">☁️ KV</text>
      <text x="455" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5a7a9a">Cloudflare</text>
    </g>

    <!-- Solution Card 1 - Advancing -->
    <g transform="translate(0, 64)">
      <rect width="505" height="80" rx="12" fill="url(#cardGrad1)" stroke="#1e3a5f" stroke-width="1"/>
      <!-- Momentum indicator -->
      <circle cx="24" cy="20" r="6" fill="#4caf50"/>
      <text x="24" y="24" text-anchor="middle" font-size="8" fill="#fff">▲</text>
      <!-- Title -->
      <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#e0e8f0">Humanitarian Corridor</text>
      <!-- Phase bar -->
      <rect x="44" y="36" width="200" height="6" rx="3" fill="#0d1f3c"/>
      <rect x="44" y="36" width="140" height="6" rx="3" fill="url(#barAdvancing)"/>
      <!-- Phase labels -->
      <text x="44" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5a7a9a">Ceasefire Talks</text>
      <text x="244" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#4caf50">→ Draft Agreement</text>
      <!-- Event count -->
      <rect x="390" y="14" width="100" height="50" rx="8" fill="#0d1f3c" fill-opacity="0.6"/>
      <text x="440" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#4fc3f7">24</text>
      <text x="440" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5a7a9a">events</text>
    </g>

    <!-- Solution Card 2 - Stable -->
    <g transform="translate(0, 152)">
      <rect width="505" height="80" rx="12" fill="url(#cardGrad2)" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="24" cy="20" r="6" fill="#ffc107"/>
      <text x="24" y="24" text-anchor="middle" font-size="8" fill="#000">●</text>
      <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#e0e8f0">Cultural Exchange Program</text>
      <rect x="44" y="36" width="200" height="6" rx="3" fill="#0d1f3c"/>
      <rect x="44" y="36" width="80" height="6" rx="3" fill="url(#barStable)"/>
      <text x="44" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5a7a9a">Exploration</text>
      <text x="244" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ffc107">→ Pilot Phase</text>
      <rect x="390" y="14" width="100" height="50" rx="8" fill="#0d1f3c" fill-opacity="0.6"/>
      <text x="440" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#4fc3f7">12</text>
      <text x="440" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5a7a9a">events</text>
    </g>

    <!-- Solution Card 3 - Stalling -->
    <g transform="translate(0, 240)">
      <rect width="505" height="80" rx="12" fill="url(#cardGrad1)" stroke="#1e3a5f" stroke-width="1"/>
      <circle cx="24" cy="20" r="6" fill="#ef5350"/>
      <text x="24" y="24" text-anchor="middle" font-size="8" fill="#fff">▼</text>
      <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#e0e8f0">Water Sharing Agreement</text>
      <rect x="44" y="36" width="200" height="6" rx="3" fill="#0d1f3c"/>
      <rect x="44" y="36" width="50" height="6" rx="3" fill="url(#barStalling)"/>
      <text x="44" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5a7a9a">Draft Agreement</text>
      <text x="244" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ef5350">→ Stalled</text>
      <rect x="390" y="14" width="100" height="50" rx="8" fill="#0d1f3c" fill-opacity="0.6"/>
      <text x="440" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#4fc3f7">8</text>
      <text x="440" y="50" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#5a7a9a">events</text>
    </g>
  </g>
</svg>
